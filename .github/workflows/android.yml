name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.6.0

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Inspect APK native libraries
        run: |
          echo "=== APK ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "=== Native libraries ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/.*/.*\\.so$' || true

          echo "=== Sherpa / ONNX libraries ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Ei 'sherpa|onnx|lib.*\\.so' || true

          echo "=== ARM64 libraries ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/' || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
