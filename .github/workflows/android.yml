name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download whisper.cpp
        run: |
          rm -rf app/src/main/cpp/whisper.cpp
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
                - name: Download Moonshine Base Ukrainian v2
        run: |
          mkdir -p app/src/main/assets/models/moonshine-uk
          curl -L --fail --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-moonshine-base-uk-quantized-2026-02-27.tar.bz2 \
            -o /tmp/moonshine.tar.bz2

          tar -xjf /tmp/moonshine.tar.bz2 \
            -C /tmp

          find /tmp -type f \( \
            -name "encoder_model.ort" -o \
            -name "decoder_model_merged.ort" -o \
            -name "tokens.txt" \
          \) -print

          MOON_DIR=$(find /tmp -type f -name "encoder_model.ort" -printf '%h\n' | head -n 1)

          cp "$MOON_DIR/encoder_model.ort" \
            app/src/main/assets/models/moonshine-uk/

          cp "$MOON_DIR/decoder_model_merged.ort" \
            app/src/main/assets/models/moonshine-uk/

          cp "$MOON_DIR/tokens.txt" \
            app/src/main/assets/models/moonshine-uk/

          echo "=== MOONSHINE MODEL ==="
          ls -lh app/src/main/assets/models/moonshine-uk/

      - name: Download whisper.cpp Tiny Q5_1
        run: |
          mkdir -p app/src/main/assets/models/whisper-small
          curl -L --fail --retry 3 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
            -o app/src/main/assets/models/whisper-small/ggml-tiny-q5_1.bin
          echo "=== WHISPER.CPP MODEL ==="
          ls -lh app/src/main/assets/models/whisper-small/ggml-tiny-q5_1.bin
          test -f app/src/main/assets/models/whisper-small/ggml-tiny-q5_1.bin
          test $(stat -c%s app/src/main/assets/models/whisper-small/ggml-tiny-q5_1.bin) -gt 25000000

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.6.0

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify whisper.cpp model in APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "models/whisper-small/ggml-tiny-q5_1.bin"
      - name: Inspect APK native libraries
        run: |
          echo "=== APK ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "=== Native libraries ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/.*/.*\\.so$' || true

          echo "=== Sherpa / ONNX libraries ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Ei 'sherpa|onnx|lib.*\\.so' || true

          echo "=== ARM64 libraries ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/' || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
