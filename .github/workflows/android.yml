name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download Whisper Turbo multilingual INT8
        run: |
          mkdir -p app/src/main/assets/models/whisper-turbo

          curl -L \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-turbo.tar.bz2 \
            -o whisper-turbo.tar.bz2

          echo "=== TURBO ARCHIVE CONTENT ==="
          tar -tjf whisper-turbo.tar.bz2 | head -50

          tar -xjf whisper-turbo.tar.bz2

          echo "=== TURBO EXTRACTED FILES ==="
          find . -maxdepth 3 -type f | grep "whisper-turbo" | head -50

          cp sherpa-onnx-whisper-turbo/turbo-encoder.int8.onnx app/src/main/assets/models/whisper-turbo/
          cp sherpa-onnx-whisper-turbo/turbo-decoder.int8.onnx app/src/main/assets/models/whisper-turbo/
          cp sherpa-onnx-whisper-turbo/turbo-tokens.txt app/src/main/assets/models/whisper-turbo/

          rm -rf sherpa-onnx-whisper-turbo whisper-turbo.tar.bz2

          echo "=== WHISPER TURBO MODEL FILES ==="
          ls -lh app/src/main/assets/models/whisper-turbo

          test -f app/src/main/assets/models/whisper-turbo/turbo-encoder.int8.onnx
          test -f app/src/main/assets/models/whisper-turbo/turbo-decoder.int8.onnx
          test -f app/src/main/assets/models/whisper-turbo/turbo-tokens.txt

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.6.0

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify Whisper model in APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "models/whisper-turbo"
      - name: Inspect APK native libraries
        run: |
          echo "=== APK ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "=== Native libraries ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/.*/.*\\.so$' || true

          echo "=== Sherpa / ONNX libraries ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Ei 'sherpa|onnx|lib.*\\.so' || true

          echo "=== ARM64 libraries ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/' || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
